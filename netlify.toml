[build]
  command = "npm run build"

# NOTE: migrations are NOT run during the Netlify build. The build runner is
# IPv4-only and cannot reach Supabase's direct connection host
# (db.<ref>.supabase.co:5432, IPv6-only on current Supabase plans), so
# `prisma migrate deploy` here fails with P1001. Apply migrations with
# `npx prisma migrate deploy` from a machine/CI that can reach the DB after a
# PR merges (see CLAUDE.md "Prisma migration workflow").

[[plugins]]
  package = "@netlify/plugin-nextjs"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# The try-on worker imports the app's lib/ modules, which pull in native and
# generated packages that esbuild must not inline.
[functions."tryon-process-background"]
  external_node_modules = ["sharp", "@prisma/client", "openai", "@huggingface/inference"]
  included_files = ["node_modules/.prisma/**", "prisma/schema.prisma"]
