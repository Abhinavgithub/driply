[build]
  # `rm -rf .next/cache` clears the Next.js build cache before each build. The
  # production build context had a corrupted/stale cache that silently
  # truncated the emitted CSS bundle (dropping the Style DNA styles) and froze
  # the deployed serverless functions — a clean build (CI + deploy previews)
  # always produces correct output. This is the in-repo equivalent of
  # Netlify's "Clear cache and deploy site".
  #
  # verify:css then fails the deploy if the built CSS bundle still dropped any
  # styles (see scripts/verify-built-css.mjs), so broken styling can never ship.
  command = "rm -rf .next/cache && npm run build && npm run verify:css"

# NOTE: migrations are NOT run during the Netlify build. The build runner is
# IPv4-only and cannot reach Supabase's direct connection host
# (db.<ref>.supabase.co:5432, IPv6-only on current Supabase plans), so
# `prisma migrate deploy` here fails with P1001. Apply migrations with
# `npx prisma migrate deploy` from a machine/CI that can reach the DB after a
# PR merges (see CLAUDE.md "Prisma migration workflow").

[[plugins]]
  package = "@netlify/plugin-nextjs"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# The try-on worker imports the app's lib/ modules, which pull in native and
# generated packages that esbuild must not inline.
[functions."tryon-process-background"]
  external_node_modules = ["sharp", "@prisma/client", "openai", "@huggingface/inference"]
  included_files = ["node_modules/.prisma/**", "prisma/schema.prisma"]
