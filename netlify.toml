[build]
  command = "npm run build"

# Production deploys apply pending migrations before building, so a schema
# change goes live in the same deploy as the code that needs it — and only
# after its PR is merged to main. Deploy previews and branch deploys use the
# default command above and never touch the database. Requires DIRECT_URL in
# the Netlify build environment; a migration failure fails the deploy (the
# old code keeps serving).
[context.production]
  command = "npx prisma migrate deploy && npm run build"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# The try-on worker imports the app's lib/ modules, which pull in native and
# generated packages that esbuild must not inline.
[functions."tryon-process-background"]
  external_node_modules = ["sharp", "@prisma/client", "openai", "@huggingface/inference"]
  included_files = ["node_modules/.prisma/**", "prisma/schema.prisma"]
